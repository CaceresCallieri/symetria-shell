# Tooling configuration ONLY — Symmetria Shell is not a Python package.
#
# There is deliberately no [project] table. The repository is a Quickshell
# config whose Python surface is the helper scripts under scripts/ (the agent
# bridge, the STT pipeline, the lock watchdog, the hook). Adding [project]
# would make the repo look installable to every tool that probes for one.
#
# ruff and pyrefly both read their [tool.*] tables without needing [project].
# The command lines that consume this file live in CLAUDE.md, under
# "Deterministic Checks" and "Full-Project Checks".

[tool.ruff]
# scripts/ holds every tracked .py file. build/ and node_modules/ are
# gitignored but ruff walks the filesystem, not the index, so they are excluded
# explicitly — otherwise a whole-project sweep lints vendored dependencies.
exclude = ["build", "node_modules", ".venv", "result"]
# Deliberately BELOW the interpreter this machine runs (3.14). target-version is
# what ruff is allowed to *propose*, and pinning it to the local interpreter is
# how these scripts ended up unrunnable anywhere else: four `except A, B:`
# clauses used PEP 758 syntax, which is valid only on 3.14+ and a SyntaxError on
# 3.12. The scripts declare `#!/usr/bin/env python3` and carry no version guard,
# so nothing would have caught it before the crash. Raise this only when the
# project decides to require a newer floor on purpose.
target-version = "py311"

[tool.ruff.lint]
# Rule sets are ENUMERATED, never inherited. ruff 0.16 grew its defaults from
# 59 rules to 413 in a single minor release and broke unpinned pipelines
# everywhere; listing them is what keeps output stable across upgrades.
#
# S (bandit security) is opt-in and has a real false-positive rate. It is kept
# deliberately: this repo's scripts open sockets, spawn subprocesses, and write
# under $XDG_RUNTIME_DIR, which is exactly the surface S covers.
select = ["E4", "E7", "E9", "F", "B", "C4", "UP", "SIM", "RUF", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/**" = ["S101"] # assert is the point of a test

# --- S603 / S607: invoking desktop binaries by name ---------------------------
#
# Every suppressed call site passes an argument LIST with a literal argv[0]
# (`pgrep`, `notify-send`, `pw-record`, `npx`) and never uses shell=True, so
# S603's "untrusted input" premise does not hold — there is no interpolation to
# exploit. S607's partial path is deliberate: a desktop shell must resolve these
# through PATH. Hardcoding /usr/bin would break on any distribution that places
# them elsewhere, and on Nix it would break everywhere.
#
# Re-audit any of these files if a call site ever starts building argv from
# data the shell did not author.
"scripts/agent-bridge.py" = ["S603", "S607"]        # pgrep, to find stale bridges
"scripts/lock-watchdog.py" = ["S603", "S607"]       # notify-send / snapshot helpers
"scripts/stt-stream.py" = ["S603"]                  # pw-record, argv is a literal list

# --- Developer-only tools -----------------------------------------------------
#
# These three are hand-run helpers for extracting and previewing sprite assets.
# They never ship in the shell and never run unattended.
#
# S108: the fixed /tmp path is the feature, not an oversight — the whole point
# is that the author knows where to open the preview. A tempfile with a random
# name would have to be printed and copied by hand every run.
# S314: the XML parsed is this repository's own generated sprite sheets, not
# untrusted input; adding defusedxml as a dependency for a preview script is
# disproportionate.
"scripts/test-sprite-preview.py" = ["S603", "S607", "S108", "S314"]
"scripts/test-svg-preview.py" = ["S603", "S607", "S108"]
"scripts/discover-claude-sprites.py" = ["S108"]     # /tmp/claude-sprites output dir

[tool.ruff.lint.mccabe]
max-complexity = 10 # enables C901 — no separate complexity tool needed

[tool.pyrefly]
project-includes = ["scripts/**/*.py"]
project-excludes = ["build/**", "node_modules/**", ".venv/**"]

# Pinned, NOT inferred from whichever interpreter happens to run pyrefly.
# Without this the checker queries the local python3 — 3.14 on the developer
# machine, 3.12 in the Nix CI — and the two infer different types for the same
# code. That produced four CI-only errors on a tree that was clean locally,
# which is a gate reporting an environment difference as a defect.
# Keep this in step with ruff's target-version above.
python-version = "3.11"

# numpy is an optional runtime dependency, imported lazily inside
# pcm_bytes_to_float32 and only reached by the faster-whisper backend. It is
# deliberately not declared anywhere, so it is absent in CI and the import is
# unresolvable there. Same treatment as faster_whisper, which is suppressed at
# its import site.
replace-imports-with-any = ["numpy", "numpy.*"]
