# qmllint policy for Symmetria Shell.
#
# READ THIS BEFORE CHANGING A LEVEL. The levels below are not taste — they are a
# measurement. Every category set to `error` produced ZERO findings across all
# 408 .qml files at the time this file was written, so it costs nothing today and
# fails the moment someone introduces the first one. Every category set to `info`
# has a real backlog, recorded with its count in the second block; `info` prints
# the finding but does not affect the exit code.
#
# Run qmllint the way CI does — never bare:
#   ./scripts/gen-qmllint-tree.py     # regenerate the qs.* module shadow tree
#   /usr/lib/qt6/bin/qmllint -I build/qmllint <file>.qml
#
# TWO THINGS WILL BITE YOU IF YOU SKIP THAT:
#
# 1. `/usr/bin/qmllint` on Arch is Qt 5.15's tool (package qt5-declarative). It
#    predates Quickshell's pragmas, exits 255 with NO output on ~93% of this
#    repo, and understands none of the categories below. The Qt6 tool lives at
#    /usr/lib/qt6/bin/qmllint. Always use the absolute path.
#
# 2. Without `-I build/qmllint`, every `import qs.config` fails to resolve, and
#    the cascade (Config, Colours et al. become unqualified identifiers) inflates
#    the findings from ~1,100 to ~13,500. See scripts/gen-qmllint-tree.py for why
#    the shadow tree exists and why qmldir files must NOT be written into the
#    source directories.

[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]

# ---------------------------------------------------------------------------
# ERROR — clean today. These are the ratchet: a new violation fails the build.
# ---------------------------------------------------------------------------
#
# Two of these earn their place by catching pitfalls that CLAUDE.md currently
# documents as undetectable by tooling:
#   ReadOnlyProperty  -> a `readonly property` written from a FileView/Process/
#                        Timer handler. This silently froze QuietMode.enabled.
#
# RequiredProperty catches the second one — the `required property string foo`
# shadowing trap that breaks delegate bindings with no runtime error — but it
# is currently stuck in the BLOCKED block below, not here.
AccessSingletonViaObject=error
AliasCycle=error
AssignmentInCondition=error
Comma=error
ComponentChildrenCount=error
ConfusingExpressionStatement=error
ConfusingMinuses=error
ConfusingPluses=error
ContextProperties=error
Deprecated=error
DuplicateEnumEntries=error
DuplicateImport=error
DuplicateInlineComponent=error
DuplicatePropertyBinding=error
DuplicatedName=error
EnumEntryMatchesEnum=error
EnumsAreNotTypes=error
EqualityTypeCoercion=error
Eval=error
FunctionUsedBeforeDeclaration=error
InheritanceCycle=error
InvalidLintDirective=error
LiteralConstructor=error
MissingEnumEntry=error
MultilineStrings=error
NonListProperty=error
NonRootEnum=error
PreferNonVarProperties=error
PrefixedImportType=error
Quick.Anchors=error
Quick.AttachedPropertyType=error
Quick.Color=error
Quick.ControlsNativeCustomize=error
Quick.PropertyChangesParsed=error
Quick.StateNoChildItem=error
Quick.UnexpectedVarType=error
ReadOnlyProperty=error
TopLevelComponent=error
TranslationFunctionMismatch=error
UnintentionalEmptyBlock=error
UnreachableCode=error
UnterminatedCase=error
VarUsedBeforeDeclaration=error
WithStatement=error

# ---------------------------------------------------------------------------
# BLOCKED — clean locally, demoted only because CI cannot see the C++ plugin.
# ---------------------------------------------------------------------------
#
# These three produce ZERO findings on a developer machine, where the Symmetria
# QML plugin is installed under /usr/lib/qt6/qml. They belong in the error block
# and were measured there.
#
# They are parked here because CI cannot resolve `Symmetria`,
# `Symmetria.Internal` or `Symmetria.Services`. Those modules come from the
# symmetria-qml-plugin derivation, whose Nix build has been failing since before
# 2026-05 on `pkg_check_modules(... libcava REQUIRED)` — the same break that
# makes every `update-flake-inputs` run red. With the plugin's types missing,
# the three categories fire on 13 files with findings that are environmental,
# not defects: `Component is missing required property modelData from
# AgentChipFor` and similar.
#
# RESTORE ALL THREE TO `error` the moment the plugin builds under Nix again.
# Nothing else needs to change — verify with a full local sweep first, which
# should still report zero.
MissingType=info
RequiredProperty=info
UnresolvedAlias=info

# ---------------------------------------------------------------------------
# INFO — real backlog. Printed on every run, does not fail the build.
# ---------------------------------------------------------------------------
#
# The number after each entry is the finding count when this baseline was
# frozen. Work one category down to zero, then promote its line to `error` in
# the same commit — that is the only way the count stays honest. Update the
# number if you reduce a category without clearing it.
#
# Do NOT promote a line without re-running the full sweep first. Several of
# these categories interact: fixing the imports is what dropped RequiredProperty
# from 253 findings to zero and let it move up to the error block.
MissingProperty=info
UnqualifiedAccess=info
UnusedImports=info
Shadow=info
UnresolvedType=info
BadSignalHandlerParameters=info
ImportFailure=info
PropertyOverride=info
IncompatibleType=info
RedundantOptionalChaining=info
UseProperFunction=info
Void=info
UncreatableType=info
StalePropertyRead=info
# 1 finding, and it is a FALSE POSITIVE — do not "fix" it and do not promote
# this line. modules/askpass/Content.qml:267 animates `y` inside
# `transform: Translate { y: ... }`. That `y` belongs to the Translate, not to
# the RowLayout, so the layout does not manage it. The category still catches
# the real version of this bug elsewhere, which is why it stays at info rather
# than disable.
Quick.LayoutsPositioning=info

# ---------------------------------------------------------------------------
# DISABLE — not applicable to this project.
# ---------------------------------------------------------------------------
#
# The three attached-property-reuse categories are Qt's own defaults, kept
# disabled deliberately. They fire on any Repeater/ListView delegate, because
# the delegate and the view both carry the same attached type, and the fix they
# suggest is WRONG: on SpecialWorkspaces.qml:123 they proposed rewriting the
# delegate's `ListView.isCurrentItem` as `view.ListView.isCurrentItem`, which
# reads the view's own attached object — a different value, and a live bug.
# Do not enable these without re-reading every suggestion by hand.
AttachedPropertyReuse=disable
Quick.AttachedPropertyReuse=disable
Quick.ControlsAttachedPropertyReuse=disable
# CompilerWarnings reports what qmlsc cannot compile to C++. Quickshell
# interprets QML at runtime and never runs qmlsc over this tree, so the category
# measures nothing that can affect the shell.
CompilerWarnings=disable
# QtDesignStudio checks enforce the subset of QML that Design Studio's visual
# editor can round-trip. This project is written by hand and never opens it.
QtDesignStudio.FunctionsNotSupportedInQmlUi=disable
QtDesignStudio.ImperativeCodeNotEditableInVisualDesigner=disable
QtDesignStudio.InvalidIdeInVisualDesigner=disable
QtDesignStudio.ReferenceToParentItemNotSupportedByVisualDesigner=disable
QtDesignStudio.UnsupportedRootTypeInQmlUi=disable
QtDesignStudio.UnsupportedTypeInQmlUi=disable
