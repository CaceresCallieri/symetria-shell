name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Both checks run in ONE job, under `nix develop`, and both always run.
#
# Under Nix, because the runner's own toolchain drifts and neither check
# survives that drift. Ubuntu 24.04 ships Qt 6.4.2 against a project targeting
# 6.11, has neither Quickshell nor this project's C++ plugin, and shipped a
# shellcheck old enough to use the pre-rename SC2317 identifier. The flake's
# devShell pins all of it through flake.lock.
#
# In one job, because the store restore is the expensive part and two jobs
# would contend over the same cache key.
#
# Both always run, because the previous layout is exactly how this workflow
# stayed broken for four months: shellcheck was the last step of a job whose
# qmllint step exited 1 first, so it never executed once, and three real
# shellcheck failures sat hidden behind the qmllint failure. `if: !cancelled()`
# on every check step is what keeps one broken check from masking another.
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v31
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-lint-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-lint-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-lint-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Run shellcheck
        if: ${{ !cancelled() }}
        run: nix develop .#lint --command bash .github/scripts/run-shellcheck.sh

      # Regenerates the qs.* module shadow tree so `import qs.config` resolves.
      # See scripts/gen-qmllint-tree.py and docs/qmllint-setup.md.
      - name: Generate the qs.* module shadow tree
        if: ${{ !cancelled() }}
        run: ./scripts/gen-qmllint-tree.py

      - name: Run qmllint
        if: ${{ !cancelled() }}
        run: nix develop .#lint --command bash .github/scripts/run-qmllint.sh

      # qmlformat is deliberately NOT run here. It lives in the pre-commit hook
      # only, because its output is version-coupled and the two sides disagree:
      # nixpkgs pins Qt 6.10.1 while developers on Arch run 6.11.1. Measured on
      # a tree formatted with 6.11.1, CI's 6.10.1 reported 18 files as
      # unformatted and a DIFFERENT set of files as unprocessable. None of that
      # is a defect — it is one formatter disagreeing with another version of
      # itself, and gating on it would mean permanent red.
      #
      # Restore this step if CI and developers ever share one Qt version.
      # Re-check after Qt 6.14 regardless: QTBUG-144943 rewrites qmlformat from
      # the DOM onto the AST, which moves both the output and the failure set.

      # Every check step prints its tool version before running. That is not
      # decoration: the three CI failures on this branch were all one tool
      # disagreeing with another version of itself, and the version line is the
      # first thing worth reading when a finding reproduces in CI but not
      # locally.
      - name: Run ruff
        if: ${{ !cancelled() }}
        run: nix develop .#lint --command bash -c 'ruff --version && ruff check . --output-format concise && ruff format --check .'

      # pyrefly is pinned to an exact version through uvx rather than taken from
      # nixpkgs. The flake pins nixpkgs at 2026-01-21, which carries pyrefly
      # 0.49.0 — a PRE-1.0 release whose inference differs enough from the
      # 1.2.0 developers run that it reported 3 errors on a locally clean tree.
      # A type checker is only a gate when both sides run the same one.
      #
      # Keep this version in step with what the catalog records and with what
      # `uv tool install pyrefly` puts on a developer machine.
      - name: Run pyrefly
        if: ${{ !cancelled() }}
        run: nix develop .#lint --command uvx pyrefly@1.2.0 check
