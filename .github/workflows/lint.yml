name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt tools
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools

      # qmllint v1.0 exits 255 for both parse errors and unresolvable imports
      # (QuickShell types). Without import resolution, ~93% of files trigger
      # exit 255 with no output. We only fail on actual diagnostic output —
      # same logic as .githooks/pre-commit.
      - name: Report tool versions
        run: |
          qmllint --version || true
          shellcheck --version

      - name: Run qmllint
        run: |
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! output=$(qmllint "$file" 2>&1) && [[ -n "$output" ]]; then
              echo "::error file=$file::$output"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name '*.qml' -not -path './.git/*' -print0)
          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::qmllint: $ERRORS file(s) failed"
            exit 1
          fi
          echo "qmllint: all files passed (note: QuickShell import errors are suppressed until import resolution is configured)"

      - name: Run shellcheck
        run: |
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! shellcheck -e SC2329 "$file"; then
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::shellcheck: $ERRORS file(s) failed"
            exit 1
          fi
          echo "shellcheck: all files passed"
